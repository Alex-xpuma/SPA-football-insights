version: '3.9'
services:
  db:
    image: postgres:15
    container_name: postgres-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: yourpassword
      POSTGRES_DB: fifa
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 5
      timeout: 5s
      start_period: 5s
    networks:
      - app-network

  ai:
    build: ./ai                 
    container_name: ai-service
    ports:
      - "5001:5000"            
    depends_on:
      - db                   
    networks:
      - app-network

  server:
    build: ./server
    container_name: node-server
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    depends_on:
      - db
      - ai
      - redis
    networks:
      - app-network

  client:
    build: ./client
    container_name: react-client
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - app-network

  redis:
    image: redis:7
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge